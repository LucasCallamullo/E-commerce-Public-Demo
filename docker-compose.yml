services: # Define los contenedores que van a funcionar juntos
  db_client_1: # Nombre del servicio de base de datos
    image: postgres:17-alpine # Usa la imagen oficial de Postgres 17 versión Alpine (ultra liviana)
    container_name: db_client_1 # El nombre que verás al usar 'docker ps'
    restart: always # Si la VPS se reinicia o el proceso falla, Docker levanta el contenedor solo
    environment:
      # Docker lee estos valores del archivo .env automáticamente
      POSTGRES_DB: ${DB_NAME}  # Nombre de la DB que se creará automáticamente
      POSTGRES_USER: ${DB_USER}    # El dueño de la base de datos
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # Contraseña de acceso
    volumes: # Persistencia de datos
      # Conecta una carpeta real de la VPS con la carpeta donde Postgres guarda los datos.
      # Sin esto, si borras el contenedor, borras toda la base de datos de tus clientes.
      - postgres_data:/var/lib/postgresql/data

    # ports: # Mapeo de puertos
    # "Puerto_En_Tu_PC:Puerto_Dentro_Del_Contenedor"
    # Lo exponemos al 5432 para que puedas entrar desde programas como DBeaver o TablePlus.
    # - "5432:5432"
    # Quitamos ports para que nadie desde afuera vea la DB
    networks:
      - back_network_1
    # LIMITES: Evita que la DB se coma toda la RAM de la VPS
    deploy:
      resources:
        limits:
          memory: 512M

  web_client_1: # Nombre del servicio de tu aplicación Django
    build: . # Le dice a Docker que busque el 'Dockerfile' en la carpeta actual para armar la imagen
    container_name: web_client_1
    restart: always
    # El comando que se ejecuta apenas arranca el contenedor:
    # 1. Aplica migraciones (crea las tablas en la DB recién levantada)
    # 2. Junta todos los archivos estáticos (CSS, JS, imágenes del admin) en una sola carpeta
    # 3. Levanta el servidor Gunicorn (nivel producción) en lugar del runserver de desarrollo
    command: >
      sh -c "python manage.py migrate && python manage.py init_store_users && python manage.py load_excel &&
         if [ \"$$DEBUG\" = \"True\" ]; then
            python manage.py runserver 0.0.0.0:8000;
         else
            python manage.py collectstatic --noinput &&
            python manage.py compress --force &&
            gunicorn ecommerce.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120;
         fi"
      
    volumes:
      - .:/app # Sincroniza tu código actual con el contenedor (útil para ver cambios en vivo)
      - static_volume:/app/staticfiles # Lugar donde Gunicorn dejará los archivos CSS/JS
      - media_volume:/app/media   # Lugar donde se guardarán las fotos de los productos
    env_file:
      - .env  # Esto le pasa las variables como variables de entorno a Django (Python)
    depends_on:
      - db_client_1 # Le dice a Docker: "No levantes 'web' hasta que 'db_client_1' esté funcionando"
      - redis_client_1
    
    # limito las network accesibles solo internas
    networks:
      - back_network_1  # comunica con postgreSQL y redis interno
      - front_network_1  # comunica con nginx
    # LIMITES: Evita que la DB se coma toda la RAM de la VPS
    deploy:
      resources:
        limits:
          memory: 1G
    # IMPORTANTE: Ya no necesitamos exponer el puerto 8000 aquí, 
    # porque entraremos por Nginx. Puedes comentar 'ports'.
    # ports:
    #  - "8000:8000" # Exponemos el puerto 8000 para poder entrar por el navegador

  nginx_client_1:
    image: nginx:alpine
    container_name: nginx_client_1
    restart: always
    ports:
      # - "80:80"   # Cambiamos 8000:80 por 80:80 para que la web entre directo
      # - "443:443" # Reservamos el puerto para cuando pongas el certificado SSL
      # por ahora dejo en local el 8000
      - "8000:80" # Entramos por el 8000 de tu PC, que mapea al 80 del contenedor Nginx

    volumes:
      # :ro significa solo lectura (más seguro)
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro 
      - media_volume:/app/media:ro  # Nginx lee las FOTOS de aca
      - static_volume:/app/staticfiles:ro  # Nginx lee los static de aca
    depends_on:
      - web_client_1
    networks:
      - front_network_1  # se comunica solo con django

  redis_client_1:
    image: redis:7-alpine
    container_name: redis_client_1
    restart: always
    # Activamos AOF (Append Only File) para máxima seguridad de datos
    # * AOF: Anota cada operación que haces en un log. Si Redis se apaga, lee ese "diario" y recrea todo.
    # maxmemory (cuánta RAM tiene permitido usar antes de borrar) 
    # maxmemory-policy (qué criterio usar para borrar).
    # allkeys-lru: LRU significa Least Recently Used (Lo menos usado recientemente). Redis buscará qué datos
    # no se consultan hace mucho y los borrará para hacer espacio a los nuevos.
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory 80mb 
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data # Guardamos el archivo de persistencia en un volumen
    networks:
      - back_network_1  # se comunica con django
    deploy:
      resources:
        limits:
          memory: 128M

# definir nuestra redes internas propias
networks:
  front_network_1: # Nginx y Django viven aquí
  back_network_1:  # Django, Postgres y Redis viven aquí. Nginx NO tiene acceso a la DB.

# Definición de los volúmenes (discos virtuales)
# Esto le dice a Docker que guarde estos datos de forma permanente, fuera del ciclo de vida del contenedor.
volumes:
  postgres_data: # Espacio para la base de datos
  static_volume: # Espacio para el CSS/JS
  media_volume:   # Espacio para las fotos (imprescindible para tu ecommerce)
  redis_data:     # Definimos el volumen para Redis